# Render Blueprint — 성경 하이브리드 검색 API (무료 티어)
#
# 사용법: Render 대시보드 → New → Blueprint → 이 저장소 선택(feature/hybrid-search 브랜치)
# 환경변수 BIBLE_API_KEY, HF_TOKEN 두 개만 대시보드에서 입력하면 된다(sync: false).
services:
  - type: web
    name: bible-search-api
    runtime: docker
    plan: free
    branch: feature/hybrid-search
    dockerfilePath: ./Dockerfile.slim
    healthCheckPath: /health
    envVars:
      - key: BIBLE_API_KEY
        sync: false          # 대시보드에서 직접 입력 (앱이 보낼 X-API-Key 값)
      - key: HF_TOKEN
        sync: false          # 대시보드에서 직접 입력 (HF Inference API 토큰)
