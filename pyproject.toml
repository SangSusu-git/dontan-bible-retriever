[project]
name = "bible-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rank-bm25>=0.2.2",
    "kiwipiepy>=0.17",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
